apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-master
  namespace: hi-rabbitmq
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: "rabbitmq"
  serviceName: rabbitmq-headless
  replicas: 3
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
      namespace: hi-rabbitmq
    spec:
      storageClassName: standard
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: "3Gi"
  template:
    metadata:
      name: rabbitmq
      namespace: hi-rabbitmq
      labels:
        app: rabbitmq
    spec:
      initContainers:
      - name: "rabbitmq-config"
        image: busybox:1.32.0
        volumeMounts:
        - name: rabbitmq-config
          mountPath: /tmp/rabbitmq
        - name: rabbitmq-config-rw
          mountPath: /etc/rabbitmq
        - name: rabbitmq-cookie
          mountPath: /var/lib/rabbitmq
        - name: rabbitmq-cookie-perm
          mountPath: /tmp/rabbitmq-cookie
        command:
        - sh
        - -c
        args:
          - |
            cp /tmp/rabbitmq/rabbitmq.conf /etc/rabbitmq/rabbitmq.conf
            cp /tmp/rabbitmq/enabled_plugins /etc/rabbitmq/enabled_plugins
            cp /tmp/rabbitmq-cookie/.erlang.cookie /var/lib/rabbitmq
            chmod 400 /var/lib/rabbitmq/.erlang.cookie
            chown 999:999 /var/lib/rabbitmq/.erlang.cookie
      volumes:
      - name: rabbitmq-config
        configMap:
          name: rabbitmq-config
          optional: false
          items:
          - key: enabled_plugins
            path: "enabled_plugins"
          - key: rabbitmq.conf
            path: "rabbitmq.conf"
      - name: rabbitmq-cookie-perm
        secret:
          secretName: erlang-cookie
      - name: rabbitmq-config-rw
        emptyDir: {}
      - name: rabbitmq-cookie
        emptyDir: {}
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      serviceAccount: rabbitmq
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
      - name: rabbitmq
        image: rabbitmq:latest
        volumeMounts:
        - name: rabbitmq-config-rw
          mountPath: "/etc/rabbitmq"
        - name: rabbitmq-data
          mountPath: "/var/lib/rabbitmq/mnesia"
        - name: rabbitmq-cookie
          mountPath: "/var/lib/rabbitmq/.erlang.cookie"
          subPath: .erlang.cookie
        env:
        - name: RABBITMQ_USE_LONGNAME
          value: "true"
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RABBITMQ_NODENAME
          value: "rabbit@$(MY_POD_NAME).rabbitmq-headless.hi-rabbitmq.svc.cluster.local"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-admin
              key: pass
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-admin
              key: user
        ports:
        - name: amqp
          containerPort: 5672
          protocol: TCP
        - name: management
          containerPort: 15672
          protocol: TCP
        - name: prometheus
          containerPort: 15692
          protocol: TCP
        - name: epmd
          containerPort: 4369
          protocol: TCP
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "status"]
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 15
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "ping"]
          initialDelaySeconds: 20
          periodSeconds: 60
          timeoutSeconds: 10
