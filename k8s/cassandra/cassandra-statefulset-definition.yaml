apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra-nodes
  namespace: hi-cassandra
  labels:
    app: cassandra
spec:
  serviceName: cassandra
  podManagementPolicy: Parallel
  replicas: 2
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      volumes:
        - name: cassandra-data
          persistentVolumeClaim:
            claimName: cassandra-data
      terminationGracePeriodSeconds: 1800
      containers:
      - name: cassandra
        image: cassandra
        imagePullPolicy: Always
        ports:
        - containerPort: 7000
          name: intra-node
        - containerPort: 7001
          name: tls-intra-node
        - containerPort: 7199
          name: jmx
        - containerPort: 9042
          name: cql
        resources:
          limits:
            cpu: "500m"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        securityContext:
          capabilities:
            add:
              - IPC_LOCK
        lifecycle:
          preStop:
            exec:
              command: 
              - /bin/sh
              - -c
              - nodetool drain
        env:
          - name: MAX_HEAP_SIZE
            value: 512M
          - name: HEAP_NEWSIZE
            value: 100M
          # - name: CASSANDRA_SEEDS
          #   value: "hi-cassandra.svc.cluster.local"
          - name: CASSANDRA_CLUSTER_NAME
            value: "hi-cassandra-cluster"
          - name: CASSANDRA_DC
            value: "DC1"
          - name: CASSANDRA_RACK
            value: "Rack1"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        readinessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - nodetool status
          initialDelaySeconds: 30
          timeoutSeconds: 30
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - nodetool status
          initialDelaySeconds: 30
          timeoutSeconds: 30
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
  volumeClaimTemplates:
  - metadata:
      name: cassandra-data
      namespace: hi-cassandra
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi