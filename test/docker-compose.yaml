version: "3"
services:
  redis-testing:
    image: redis:alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s 
    container_name: client-testing
    networks:
      - hi-test-services
  rabbitmq-testing:
    image: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    container_name: rabbit-testing
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - hi-test-services  
  cassandra-testing:
    image: cassandra:latest
    ports:
      - "9001:9042"
    container_name: cassandra-testing
    healthcheck:
      test: ["CMD","nodetool", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - hi-test-services
  mongodb-testing:
    image: mongo:latest
    ports: 
      - "27018:27017"
    container_name: mongodb-testing
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - hi-test-services
  io-server-testing:
    image:  manik2708/hi-io-server:latest
    ports:
      - "3500:3500"
    environment:
      REDIS_URL: redis://client-testing:6379
      PORT: 3500
    container_name: hi-io-server-testing
    networks:
      - hi-test-services 
networks:
  hi-test-services:
    driver: bridge
