version: "3"
services:
  web:
    build: 
      context: .
      dockerfile: TestDockerFile
    user: "node:node"
    ports:
      - "3000:3000"
    depends_on:
      - redis-testing
      - rabbitmq-testing
      - cassandra-testing
  redis-testing:
    image: redis:alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "6392:6379"
    container_name: client-testing
  rabbitmq-testing:
    image: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    container_name: rabbit-testing  
  cassandra-testing:
    image: cassandra:latest
    ports:
      - "9001:9042"
    container_name: cassandra-testing